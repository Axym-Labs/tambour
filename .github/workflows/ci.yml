name: CI

on:
  push:
    branches: [main, 'build/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      skiasharp:
        description: >-
          A SkiaSharp version to build against instead of the pinned one, forced past NuGet's
          downgrade check, to see the window checks fail on a broken pair
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # Marey's examples, at the pinned commit: every GUI action is checked against each one that
      # binds a figure.
      - name: Read the pinned commit
        id: pin
        shell: bash
        run: echo "commit=$(sed -n 's:.*<MareyCommit>\(.*\)</MareyCommit>.*:\1:p' Directory.Packages.props)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Axym-Labs/marey
          ref: ${{ steps.pin.outputs.commit }}
          path: marey
          sparse-checkout: examples

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pin a different SkiaSharp
        if: inputs.skiasharp != ''
        shell: bash
        env:
          SKIASHARP: ${{ inputs.skiasharp }}
        run: |
          sed -i "s/\"SkiaSharp\" Version=\"\[[^]]*\]\"/\"SkiaSharp\" Version=\"[$SKIASHARP]\"/" Directory.Packages.props
          grep '"SkiaSharp"' Directory.Packages.props
          echo "NUGET_NOWARN=-p:NoWarn=NU1605" >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: dotnet build Tambour.slnx -c Release ${{ env.NUGET_NOWARN }}

      # The headless test paints the figure pane on Skia's raster canvas and compares it with
      # Marey's PNG export of the same scene.
      - name: Test
        env:
          MAREY_EXAMPLES: ${{ github.workspace }}/marey/examples
        run: dotnet test Tambour.slnx -c Release --no-build --logger "console;verbosity=normal"

      # Every worker and language service the tests started ends with them: a process still there
      # 10 s on, stopped or running, is one its host failed to end.
      - name: Nothing left behind by the tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          for _ in $(seq 10); do pgrep -f 'Tambour.Tests/bin/.*/tambour --' > /dev/null || exit 0; sleep 1; done
          ps -o pid,stat,args -p "$(pgrep -d, -f 'Tambour.Tests/bin/.*/tambour --')"
          echo "::error::the tests left processes of the app behind"
          exit 1

      # A real window, which catches a SkiaSharp, HarfBuzzSharp or Avalonia upgrade that breaks the
      # pair. The runners have no GPU. Windows paints on ANGLE over WARP, and its canvas must be
      # OpenGL. Linux runs under Xvfb, where the only GL is Mesa's llvmpipe, which Avalonia declines
      # (GlxRendererBlacklist) and paints in software instead, as it would for a user.
      # After the build, whether or not the tests passed: the two checks report on their own.
      - name: Paint a figure in a window
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          run=(dotnet src/Tambour/bin/Release/net10.0/tambour.dll --self-check)
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}" 2>&1 | tee self-check.log
          test "${PIPESTATUS[0]}" -eq 0
          if [ "$RUNNER_OS" = Windows ]; then
            grep -q 'canvas: OpenGL' self-check.log || { echo "::error::the figure painted on a CPU canvas, not OpenGL"; exit 1; }
          fi

      # The figure pane in a real window, both paint paths against Marey's PNG export, and a
      # million points timed from their bytes to the screen. Linux clears Avalonia's llvmpipe
      # blacklist for this check, so it paints on software GL rather than the CPU.
      - name: Check the figure pane
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          run=(dotnet src/Tambour/bin/Release/net10.0/tambour.dll --check-pane)
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}"

      # At a scaling of 2 the GPU path draws its 1x image stretched, which the check reports until
      # Marey's GPU renderer can render at a scale; reported, not required.
      - name: Check the figure pane at a scaling of 2
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        continue-on-error: true
        timeout-minutes: 5
        run: xvfb-run -a dotnet src/Tambour/bin/Release/net10.0/tambour.dll --check-pane --scaling 2

  # The language service on a machine with no .NET: a self-contained publish, run in a bubblewrap
  # sandbox that hides every .NET installation and the network, reports a script's unit error
  # within 3 s of starting cold (9 s on a shared runner, as the other timed checks).
  no-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained
        run: dotnet publish src/Tambour -c Release -r linux-x64 --self-contained -o artifacts/publish/linux-x64

      # Ubuntu's AppArmor refuses unprivileged user namespaces, which bubblewrap needs.
      - name: Install bubblewrap
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: The unit error, with no .NET
        timeout-minutes: 3
        run: tools/no-dotnet.sh artifacts/publish/linux-x64/tambour --check-analysis tests/Tambour.Tests/scripts/unit-error.fsx

  # The packages, on a version tag or by hand: a tarball and an AppImage for Linux, a zip for
  # Windows, kept as the run's artifacts, which a tag's release below carries. The Linux tarball, unpacked
  # in a sandbox with no .NET, is checked end to end: a script opened, drawn, its unit error shown
  # and taken back, an action applied and taken back, and a PNG exported that renderPng draws.
  # The Windows zip is checked by hand on a clean machine.
  package:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install bubblewrap and Xvfb
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap xvfb xauth
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # appimagetool 1.9.1 and the runtime it embeds, both pinned by their digests, run without
      # FUSE. Left to itself, appimagetool fetches the runtime's newest build.
      - name: Fetch appimagetool
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c <<'SUMS'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          SUMS
          chmod +x appimagetool.AppImage
          printf '#!/bin/sh\nexec "%s" --appimage-extract-and-run --runtime-file "%s" "$@"\n' \
            "$RUNNER_TEMP/appimagetool.AppImage" "$RUNNER_TEMP/runtime-x86_64" > bin/appimagetool
          chmod +x bin/appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A tag's version, or the commit's for a run by hand, since a branch's name may hold a slash.
      - name: Build the packages
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA::7}; fi
          tools/package.sh "$version"

      - name: The package, end to end, with no .NET
        timeout-minutes: 5
        run: |
          unpacked=$(mktemp -d)
          tar -xzf artifacts/package/*-linux-x64.tar.gz -C "$unpacked"
          xvfb-run -a tools/no-dotnet.sh "$unpacked"/tambour-*/tambour --check-package

      - name: The AppImage, end to end
        timeout-minutes: 5
        run: xvfb-run -a artifacts/package/*.AppImage --appimage-extract-and-run --check-package

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/package/*.tar.gz
            artifacts/package/*.AppImage
            artifacts/package/*.zip
          if-no-files-found: error


  # On a version tag, once the tests and the packages' checks hold: a draft release carrying the
  # packages and their checksums, its notes naming the Marey inside. Published by hand once the
  # Windows zip has been tried. A tag with a suffix (v1.0.0-rc.1) makes a prerelease; a rerun
  # replaces the draft's files.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, no-dotnet, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/package

      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          marey=$(sed -n 's:.*<MareyVersion>\(.*\)</MareyVersion>.*:\1:p' Directory.Packages.props)
          commit=$(sed -n 's:.*<MareyCommit>\(.*\)</MareyCommit>.*:\1:p' Directory.Packages.props)
          cd artifacts/package
          sha256sum -- * > SHA256SUMS
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Tambour $version, on Marey [$marey](https://www.nuget.org/packages/Marey/$marey) (Axym-Labs/marey@${commit::7}).

          - \`tambour-$version-linux-x64.tar.gz\`: unpacks to a directory that runs from anywhere.
          - \`tambour-$version-x86_64.AppImage\`: the same, as one file.
          - \`tambour-$version-win-x64.zip\`: unpacks to a folder; \`tambour.exe\` runs from it. Not
            code-signed yet: the README's *On Windows* says what SmartScreen and Smart App Control do.

          None of them needs .NET installed. \`SHA256SUMS\` holds the files' checksums.
          NOTES
          case "$version" in *-*) pre=--prerelease ;; *) pre= ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --draft $pre --verify-tag \
              --title "Tambour $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
